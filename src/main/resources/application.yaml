
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/seletivo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:seletivo}
    password: ${DB_PASSWORD:seletivo123}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  logging:
    level:
      org.flywaydb: DEBUG

  jpa:
    hibernate:
      ddl-auto: validate

app:
  security:
    cors:
      allowed-origins:
        - "http://localhost:3000"
    jwt:
      secret: "SELETIVOSENIORSEPLAGMT2026VOUTENTARPASSAR"
      access-token-ttl: 5m
      refresh-token-ttl: 30m
      issuer: "seletivo-api"
    rate-limit:
      requests-per-minute: 10
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:album-covers}
    presigned-ttl: ${MINIO_PRESIGNED_TTL:30m}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
  endpoint:
    health:
      probes:
        enabled: true
